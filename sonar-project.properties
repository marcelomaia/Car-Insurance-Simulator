# Must match the SonarCloud / SonarQube project key
sonar.organization=marcelomaia
sonar.projectKey=marcelomaia_Car-Insurance-Simulator_120e9ae5-a590-42e0-bf0a-75d1371a173c
sonar.projectName=Car Insurance Premium Simulator

sonar.sources=domain,scripts
sonar.tests=domain/tests,scripts/tests

# Exclude test trees from main sources so they are only indexed via sonar.tests (disjoint sets).
sonar.exclusions=**/.git/**,**/.pytest_cache/**,**/.ruff_cache/**,**/.venv/**,**/dist/**,**/htmlcov/**,**/venv/**,domain/tests/**,scripts/tests/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
