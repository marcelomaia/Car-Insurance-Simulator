name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package (editable) with dev tools
        run: pip install -e ".[dev]"

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Alphabetical order (honeypot script)
        run: python scripts/check_order.py

      - name: Pytest with coverage (XML for Sonar)
        run: python -m pytest --cov=application --cov=domain --cov=infrastructure --cov=presentation --cov=scripts --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
