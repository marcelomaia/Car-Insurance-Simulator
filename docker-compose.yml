services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Injects `CAR_INSURANCE_*` from a host `.env` into the container (Settings also reads env vars).
    # Copy `.env.example` → `.env` to override defaults; omit `.env` to use built-in defaults.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: UTC
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
