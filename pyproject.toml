[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "domain*", "infrastructure*"]
exclude = ["application.tests*", "domain.tests*", "infrastructure.tests*", "scripts.tests*"]

[project]
name = "car-insurance-premium-simulator"
version = "0.1.0"
description = "Car Insurance Premium Simulator microservice"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["application/tests", "domain/tests", "infrastructure/tests", "scripts/tests"]

[tool.coverage.run]
branch = false
source = ["application", "domain", "infrastructure", "scripts"]
omit = [
    "**/.venv/**",
    "**/tests/**",
    "**/venv/**",
    "application/tests/**",
    "domain/tests/**",
    "infrastructure/tests/**",
    "scripts/tests/**",
]

[tool.coverage.report]
precision = 2
skip_covered = false
skip_empty = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PLC",
    "C901",
]

[tool.ruff.lint.isort]
known-first-party = ["application", "domain", "infrastructure", "presentation", "scripts"]
